x-airflow-common: &airflow-common
  image: apache/airflow:2.10.2
  environment:
    - AIRFLOW__CORE__EXECUTOR=LocalExecutor
    - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/airflow
    - AIRFLOW__CORE__LOAD_EXAMPLES=False
    - AIRFLOW__WEBSERVER__SECRET_KEY=${AIRFLOW_SECRET_KEY}
    - _PIP_ADDITIONAL_REQUIREMENTS=pandas python-dotenv
  env_file:
    - .env
  volumes:
    - ./dags:/opt/airflow/dags
    - ./:/opt/airflow/project
    - ./logs:/opt/airflow/logs
  depends_on:
    - db

services:
  db:
    image: postgres:15-alpine
    env_file: 
      - .env
    ports: 
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d exchange_rates"]
      interval: 5s
      retries: 5
    volumes: 
      - pgdata:/var/lib/postgresql/data
  
  etl:
    build: .
    depends_on:
      - db
    env_file:
      - .env

  airflow-init:
    <<: *airflow-common
    command: >
      bash -c "airflow db init && 
      airflow users create --role Admin --username admin --password admin --email admin@example.com --firstname Admin --lastname User"

  airflow-webserver:
    <<: *airflow-common
    command: webserver
    ports:
      - "8080:8080"
    depends_on:
      - airflow-init

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    depends_on:
      - airflow-init
      
volumes: 
  pgdata: