services:
  db:
    image: postgres:15-alpine
    env_file: 
      - .env
    ports: 
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d exchange_rates"]
      interval: 5s
      retries: 5
    volumes: 
      - pgdata:/var/lib/postgresql/data
      
volumes: 
  pgdata: